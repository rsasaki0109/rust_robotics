name: Pose observation loss checks

on:
  push:
    branches: [ main, dev/*, feat/*, task/* ]
    paths:
      - .github/workflows/pose-observation-loss.yml
      - experiments/pose_observation_loss/**
      - crates/rust_robotics_control/**
      - crates/rust_robotics_core/**
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/pose-observation-loss.yml
      - experiments/pose_observation_loss/**
      - crates/rust_robotics_control/**
      - crates/rust_robotics_core/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r experiments/pose_observation_loss/requirements-ci.txt

      - name: Show toolchains
        run: |
          python --version
          rustc --version

      - name: Check frozen reset review inputs and exports
        env:
          PYTHONPATH: experiments/pose_observation_loss
        run: |
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/pose-loss-frozen-inputs.log"
          import review_reset_evidence as review

          if not __debug__:
              raise RuntimeError("Run without Python optimization")
          _, inputs = review.preflight()
          manifest = review.read_json(review.STUDY / "review-sources.json")
          assert manifest["input_sha256"] == inputs
          for field, path in (
              ("script_sha256", review.ROOT / "review_reset_evidence.py"),
              ("protocol_sha256", review.STUDY / "protocol.md"),
              ("freeze_sha256", review.STUDY / "freeze-pins.json"),
          ):
              assert review.sha(path) == manifest["analysis"][field], path
          for name, digest in manifest["output_sha256"].items():
              assert review.sha(review.STUDY / name) == digest, name
          original = review.read_csv(
              review.RESULTS / "fusion-return-reset-surplus" / "surplus.csv"
          )
          saved = review.read_csv(review.STUDY / "reset-evidence.csv")
          assert len(saved) == 19
          assert review.project_overview(original) == saved
          print(f"Verified {len(inputs)} frozen inputs and all {len(saved)} review rows")
          PY

      - name: Run Python tests and Rust source cross-checks without skips
        run: |
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/pose-loss-tests.log"
          import sys
          import unittest

          if not __debug__:
              raise RuntimeError("Run without Python optimization")
          suite = unittest.defaultTestLoader.discover(
              "experiments/pose_observation_loss", pattern="test_*.py"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped:
              raise SystemExit("Expected a nonempty test suite with no skipped tests")
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pose-observation-loss-checks
          path: ${{ runner.temp }}/pose-loss-*.log
          if-no-files-found: warn
          retention-days: 14

  reset-evidence-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned replay dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r experiments/pose_observation_loss/requirements-replay.txt

      - name: Record replay environment
        run: |
          python -VV > "$RUNNER_TEMP/reset-review-environment.txt"
          python -m pip freeze >> "$RUNNER_TEMP/reset-review-environment.txt"

      - name: Replay six collectors, plotters and independent verifiers
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/reset-review-mpl
          XDG_CACHE_HOME: ${{ runner.temp }}/reset-review-cache
        run: |
          python -B experiments/pose_observation_loss/ci_reset_replay.py \
            --output "$RUNNER_TEMP/fusion-return-reset-review" \
            2>&1 | tee "$RUNNER_TEMP/reset-review-runner.log"

      - name: Check completed replay
        run: |
          python -B experiments/pose_observation_loss/ci_reset_replay.py \
            --check "$RUNNER_TEMP/fusion-return-reset-review" \
            | tee "$RUNNER_TEMP/reset-review-receipt.json"

      - name: Annotate replay failure diagnostics
        if: failure()
        env:
          PYTHONPATH: experiments/pose_observation_loss
        run: |
          python - <<'PY'
          import difflib
          import os
          from pathlib import Path
          import review_reset_evidence as review

          root = Path(os.environ["RUNNER_TEMP"])
          packet = root / "fusion-return-reset-review"

          def annotate(title, message):
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{message}")

          logs = list(packet.glob("stages/*/*.log"))
          if logs:
              latest = max(logs, key=lambda p: p.stat().st_mtime_ns)
              annotate("Last replay child log", "\n".join(latest.read_text(errors="replace").splitlines()[-24:]))
          runner = root / "reset-review-runner.log"
          if runner.exists():
              annotate("Replay runner log", "\n".join(runner.read_text(errors="replace").splitlines()[-24:]))
          for stem in review.STEMS:
              reference = review.RESULTS / ("fusion-return-" + stem.replace("_", "-"))
              work = packet / "stages" / stem
              for fresh in [*work.glob("collector/*"), *work.glob("figures/*"), *work.glob("independent-verification.json")]:
                  baseline = reference / fresh.name
                  if fresh.is_file() and baseline.is_file() and review.sha(fresh) != review.sha(baseline):
                      difference = difflib.unified_diff(baseline.read_text().splitlines(), fresh.read_text().splitlines(), fromfile="frozen", tofile="replayed")
                      annotate(f"Changed replay artifact: {stem}/{fresh.name}", "\n".join(list(difference)[:30]))
          PY

      - name: Upload replay outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reset-evidence-replay
          path: |
            ${{ runner.temp }}/fusion-return-reset-review/
            ${{ runner.temp }}/reset-review-runner.log
            ${{ runner.temp }}/reset-review-receipt.json
            ${{ runner.temp }}/reset-review-environment.txt
          if-no-files-found: warn
          retention-days: 14
