<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RustRobotics Playground</title>
  <meta name="description" content="Drive a robot with live LiDAR SLAM, race grid planners, and compare filters and controllers in your browser (Rust + WASM).">
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10141a;
      color: #e8ecf1;
      font-family: system-ui, sans-serif;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      pointer-events: none;
      color: #98a2b0;
      font-size: 15px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ff9838;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      /* Joystick and map drags must not scroll or zoom the page on phones. */
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- Removed by the app once it is running (src/main.rs). -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Loading the RustRobotics playground…</div>
  </div>
  <canvas id="rust_robotics_playground"></canvas>
  <link data-trunk rel="rust" data-bin="rust_robotics_playground" data-cargo-profile="wasm-release" data-wasm-opt="z" />
</body>
</html>
