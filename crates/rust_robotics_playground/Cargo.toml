[package]
name = "rust_robotics_playground"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Interactive egui playground for RustRobotics algorithms (not published to crates.io)"
publish = false

[dependencies]
# No egui default fonts in the web build: ui_kit::install_fonts embeds just
# the two it needs (Ubuntu-Light and the icon font), about 440 KB less
# gzipped WASM than all four. Native builds keep them (eframe below).
egui = { version = "0.31", default-features = false }
epaint_default_fonts = "0.31"
rust_robotics_planning = { workspace = true }
rust_robotics_localization = { workspace = true }
rust_robotics_slam = { workspace = true }
rust_robotics_optimization = { workspace = true }
rust_robotics_control = { workspace = true, features = ["std"] }
rust_robotics_core = { workspace = true, features = ["std"] }
nalgebra = { workspace = true, features = ["std"] }
rand = { workspace = true }
rand_distr = { workspace = true }
# std::time::Instant panics on wasm32-unknown-unknown; web-time is a drop-in
# replacement backed by performance.now() in the browser.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Element", "Node", "Event", "EventTarget", "History", "Location", "Storage"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
default = []

[[bin]]
name = "rust_robotics_playground"
path = "src/main.rs"
