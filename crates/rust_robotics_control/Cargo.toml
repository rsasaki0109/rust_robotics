[package]
name = "rust_robotics_control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://rsasaki0109.github.io/rust_robotics/api/rust_robotics_control/"
description = "Control and path tracking algorithms for the RustRobotics workspace"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# Without `std`, the Tier 1 controllers (PID, Pure Pursuit, Stanley, LQR Steer)
# build for bare-metal targets; the sampling / optimization-based controllers
# (MPPI, MPC, cgmres, pusher-slider, racing, ...) need `std` for random number
# generation or the clarabel solver.
std = [
    "rust_robotics_core/std",
    "nalgebra/std",
    "num-traits/std",
    "dep:rand",
    "dep:rand_distr",
    "dep:clarabel",
]
viz = ["dep:gnuplot"]

[dependencies]
rust_robotics_core = { workspace = true }
nalgebra = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
gnuplot = { workspace = true, optional = true }
clarabel = { version = "0.11", optional = true }
