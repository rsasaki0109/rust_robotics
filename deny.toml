[advisories]
ignore = [
    # paste is a transitive dep via nalgebra, no action available
    "RUSTSEC-2024-0436",
    # rand 0.8 unsoundness with thread_rng+log; does not affect this project
    # (we don't use custom loggers with thread_rng). Will resolve with rand 0.9 migration.
    "RUSTSEC-2026-0097",
    # quick-xml is a build-time dependency of wayland-scanner 0.31.10, which
    # constrains it to 0.39. The affected XML parser is not used at runtime by
    # RustRobotics. Remove both exceptions when wayland-scanner accepts >=0.41.
    # Revisit by 2026-10-01.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ttf-parser is pulled in by egui/eframe through ab_glyph. The advisory has
    # no safe upgrade; replace/remove this exception when egui migrates its font
    # parser. Revisit by 2026-10-01.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Ubuntu-font-1.0",
    "Zlib",
    "LGPL-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
